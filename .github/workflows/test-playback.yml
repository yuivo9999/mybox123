name: Playback lifecycle tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playback-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playback-lifecycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Run playback lifecycle behavior tests
        run: npm run test:playback-lifecycle

      - name: Run architecture boundary tests
        run: npm run test:architecture
