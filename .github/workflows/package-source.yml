name: package-source
on:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: zip -r mybox123-state-v0.3.1.zip . -x '.git/*' 'mybox123-state-v0.3.1.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: mybox123-state-v0.3.1
          path: mybox123-state-v0.3.1.zip
