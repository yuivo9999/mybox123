name: Android Scaffold Bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and regenerate lockfile
        run: npm install

      - name: Generate Android platform
        run: npx cap add android

      - name: Commit generated Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json capacitor.config.ts android
          git diff --cached --quiet && exit 0
          git commit -m "chore(android): generate Capacitor Android project"
          git push
